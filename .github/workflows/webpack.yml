name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
      continue-on-error: true

    - name: Check files exist
      run: ls -l index.html app.js style.css mutun.json

    - name: Validate mutun.json
      run: node -e "JSON.parse(require('fs').readFileSync('mutun.json','utf8')); console.log('mutun.json OK')"
