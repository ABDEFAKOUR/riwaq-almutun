<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d32"><title>قراءة المتون | رِواق المتون</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="unified-shell.css"><script>(function(){try{var p=JSON.parse(localStorage.getItem("riwaq-prefs")||"{}");document.documentElement.dataset.theme=p.theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}})();</script></head>
<body><header class="topbar"><a class="brand" href="./index.html"><span class="brand-mark">رِ</span><span><strong>رِواق المتون</strong><small>قراءة المتون</small></span></a><div class="gateway-theme-actions"><button id="theme-btn" class="button button-outline small" type="button" aria-label="تفعيل الوضع الليلي">◐</button><a class="button button-outline small" href="./index.html">الرئيسية ←</a></div></header>
<main class="container"><section class="gateway-intro" style="padding:48px 0 24px"><span class="eyebrow">المكتبة المقروءة</span><h1>قراءة المتون (PDF)</h1><p>اختر ملف PDF من جهازك لقراءته داخل التطبيق.</p></section>
<section class="settings-panel section" style="background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px"><label class="button button-primary" for="pdf-file">اختيار ملف PDF</label><input id="pdf-file" type="file" accept="application/pdf,.pdf" hidden><p id="pdf-name" style="color:var(--muted);font-size:13px">لم يتم اختيار ملف بعد.</p><div id="pdf-viewer" style="height:70vh;min-height:420px;background:#eee;border-radius:12px;overflow:hidden"><p style="padding:24px;text-align:center;color:#555">سيظهر ملف PDF هنا بعد اختياره.</p></div><p style="font-size:12px;color:var(--muted)">ملاحظة: هذه النسخة تفتح الملفات التي تختارها من جهازك؛ لم تتم إضافة مكتبة PDF جاهزة بعد.</p></section></main>
<script>let currentUrl=null;document.getElementById('pdf-file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(f);document.getElementById('pdf-name').textContent=f.name;const frame=document.createElement('iframe');frame.src=currentUrl;frame.title='قارئ PDF';frame.style='width:100%;height:100%;border:0';const box=document.getElementById('pdf-viewer');box.replaceChildren(frame)});</script><script src="theme.js" defer></script></body></html>
